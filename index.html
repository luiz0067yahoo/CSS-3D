<div class="cubo">
    <div class="topo"></div>
    <div class="frente"></div>
    <div class="base"></div>
    <div class="esquerda"></div>
    <div class="atraz"></div>
    <div class="direita"></div>
</div>
<button onclick="rodarxvoltar()">Rodarx--</button>
<button onclick="rodarxavancar()">Rodarx++</button>
<br>
<button onclick="rodaryvoltar()">Rodary--</button>
<button onclick="rodaryavancar()">Rodary++</button>
<br>
<button onclick="rodarzvoltar()">Rodarz--</button>
<button onclick="rodarzavancar()">Rodarz++</button>
<style>
    body {
        background-color: cadetblue;
    }

    .topo {
        height: 400px;
        width: 400px;
        background-color: white;
        margin-left: auto;
        margin-right: auto;
        display: block;
        transform: perspective(500px) translateZ(-200px) translatey(200px) rotateX(90deg);
    }

    .base {
        height: 400px;
        width: 400px;
        background-color: yellow;
        margin-left: auto;
        margin-right: auto;
        margin-top: -400px;
        display: block;

        transform: perspective(500px) translateZ(-200px) translatey(200px) rotateX(90deg);
    }

    .frente {
        height: 400px;
        width: 400px;
        background-color: green;
        margin-left: auto;
        margin-right: auto;
        display: block;
        transform: perspective(500px);
        z-index: 100;
    }


    .atraz {
        height: 400px;
        width: 400px;
        background-color: blue;
        margin-left: auto;
        margin-right: auto;
        margin-top: -400px;
        display: block;
        transform: perspective(500px) translateZ(-400px);
    }

    .esquerda {
        height: 400px;
        width: 400px;
        background-color: orange;
        margin-left: auto;
        margin-right: auto;
        margin-top: -400px;
        display: block;
        transform: perspective(500px) translateZ(-200px) translatex(-200px) rotateY(90deg);
    }

    .direita {
        height: 400px;
        width: 400px;
        background-color: red;
        margin-left: auto;
        margin-right: auto;
        margin-top: -400px;
        display: block;
        transform: perspective(500px) translateZ(-200px) translatex(200px) rotateY(90deg);
    }
</style>
<script>
    var degx = 0;
    var degy = 0;
    var degz = 0;
    function rodarxavancar() {
        let quadrado = document.getElementsByClassName("cubo")[0];
        degx = degx + 10;
        quadrado.style.transform = " rotatex(" + degx + "deg) rotatey(" + degy + "deg) rotatez(" + degz + "deg)";
    }
    function rodarxvoltar() {
        let quadrado = document.getElementsByClassName("cubo")[0];
        degx = degx - 10;
        quadrado.style.transform = " rotatex(" + degx + "deg) rotatey(" + degy + "deg) rotatez(" + degz + "deg)";
    }
    function rodaryavancar() {
        let quadrado = document.getElementsByClassName("cubo")[0];
        degy = degy + 10;
        quadrado.style.transform = " rotatex(" + degx + "deg) rotatey(" + degy + "deg) rotatez(" + degz + "deg)";
    }
    function rodaryvoltar() {
        let quadrado = document.getElementsByClassName("cubo")[0];
        degy = degy - 10;
        quadrado.style.transform = " rotatex(" + degx + "deg) rotatey(" + degy + "deg) rotatez(" + degz + "deg)";
    }


    function rodarzavancar() {
        let quadrado = document.getElementsByClassName("cubo")[0];
        degz = degz + 10;
        quadrado.style.transform = " rotatex(" + degx + "deg) rotatey(" + degy + "deg) rotatez(" + degz + "deg)";
    }
    function rodarzvoltar() {
        let quadrado = document.getElementsByClassName("cubo")[0];
        degz = degz - 10;
        quadrado.style.transform = " rotatex(" + degx + "deg) rotatey(" + degy + "deg) rotatez(" + degz + "deg)";
    }
</script>
