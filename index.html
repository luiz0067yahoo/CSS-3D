<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubo 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        .cena {
            width: 260px;
            height: 260px;
            perspective: 800px;
            margin: 90px auto;
            cursor: grab;
        }

        .cena:active {
            cursor: grabbing;
        }

        .cubo {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(30deg);
            transition: transform 0.15s ease-out;
        }

        .cubo.no-transition {
            transition: none;
        }

        /* Faces do Cubo */
        .cubo>div {
            position: absolute;
            width: 260px;
            height: 260px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            backface-visibility: visible;
        }

        .frente {
            background: green;
            transform: rotateY(0deg) translateZ(130px);
        }

        .atraz {
            background: blue;
            transform: rotateY(180deg) translateZ(130px);
        }

        .direita {
            background: red;
            transform: rotateY(90deg) translateZ(130px);
        }

        .esquerda {
            background: orange;
            transform: rotateY(-90deg) translateZ(130px);
        }

        .topo {
            background: white;
            transform: rotateX(90deg) translateZ(130px);
        }

        .base {
            background: yellow;
            transform: rotateX(-90deg) translateZ(130px);
        }

        /* Controles Minimalistas */
        .controles {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .grupo-botoes {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
    </style>
</head>

<body>

    <div class="cena" id="cena">
        <div class="cubo" id="cubo">
            <div class="topo"></div>
            <div class="frente"></div>
            <div class="base"></div>
            <div class="esquerda"></div>
            <div class="atraz"></div>
            <div class="direita"></div>
        </div>
    </div>

    <div class="controles">
        <div class="grupo-botoes">
            <button onclick="rodarxvoltar()">X -</button>
            <button onclick="rodarxavancar()">X +</button>
            <button onclick="rodaryvoltar()">Y -</button>
            <button onclick="rodaryavancar()">Y +</button>
            <button onclick="rodarzvoltar()">Z -</button>
            <button onclick="rodarzavancar()">Z +</button>
        </div>
        <div class="grupo-botoes">
            <button onclick="resetarRotacao()">Reset</button>
            <button id="btnAuto" onclick="alternarAutoRotacao()">Auto</button>
        </div>
    </div>

    <script>
        let degx = 0, degy = 0, degz = 0;
        let autoInterval = null;
        const cubo = document.getElementById("cubo");

        function aplicarTransformacao() {
            cubo.style.transform = `rotateX(${degx}deg) rotateY(${degy}deg) rotateZ(${degz}deg)`;
        }

        function rodarxavancar() { degx += 5; aplicarTransformacao(); }
        function rodarxvoltar() { degx -= 5; aplicarTransformacao(); }
        function rodaryavancar() { degy += 5; aplicarTransformacao(); }
        function rodaryvoltar() { degy -= 5; aplicarTransformacao(); }
        function rodarzavancar() { degz += 5; aplicarTransformacao(); }
        function rodarzvoltar() { degz -= 5; aplicarTransformacao(); }
        function resetarRotacao() { degx = 0; degy = 0; degz = 0; aplicarTransformacao(); }

        function alternarAutoRotacao() {
            const btn = document.getElementById("btnAuto");
            if (autoInterval) {
                clearInterval(autoInterval);
                autoInterval = null;
            } else {
                autoInterval = setInterval(() => {
                    degy = (degy + 1) % 360;
                    degx = (degx + 1) % 360;
                    degz = (degz + 1) % 360;
                    aplicarTransformacao();
                }, 20);
            }
        }

        // Arrastar com Mouse / Touch
        let isDragging = false, startX, startY;
        const cena = document.getElementById("cena");

        function startDrag(x, y) {
            isDragging = true;
            startX = x;
            startY = y;
            cubo.classList.add('no-transition');
        }

        function moveDrag(x, y) {
            if (!isDragging) return;
            degy += (x - startX) * 0.5;
            degx -= (y - startY) * 0.5;
            startX = x;
            startY = y;
            aplicarTransformacao();
        }

        function endDrag() {
            if (isDragging) {
                isDragging = false;
                cubo.classList.remove('no-transition');
            }
        }

        cena.addEventListener('mousedown', e => startDrag(e.clientX, e.clientY));
        window.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
        window.addEventListener('mouseup', endDrag);

        cena.addEventListener('touchstart', e => {
            if (e.touches.length === 1) startDrag(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
        window.addEventListener('touchmove', e => {
            if (e.touches.length === 1) moveDrag(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
        window.addEventListener('touchend', endDrag);

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp') rodarxvoltar();
            if (e.key === 'ArrowDown') rodarxavancar();
            if (e.key === 'ArrowLeft') rodaryvoltar();
            if (e.key === 'ArrowRight') rodaryavancar();
        });

        aplicarTransformacao();
    </script>
</body>

</html>
